<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSCRL — Invite a Member</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://jcqnsgbnsmwoncjehvqq.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  #loading { color: #666; }
  #content { display: none; }
  #logout-btn { float: right; width: auto; }
  input, select { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; margin-top: 10px; cursor: pointer; }
  #error { color: #c0392b; margin-top: 10px; font-size: 0.9em; }
  #msg { color: #2c7a2c; margin-top: 10px; font-size: 0.9em; }
  p.hint { color: #555; font-size: 0.9em; }
  a.back { display: block; margin-top: 20px; font-size: 0.85em; }
</style>
</head>
<body>

<div id="loading">Checking login…</div>

<div id="content">
  <button id="logout-btn">Log Out</button>
  <h2>Invite a Member</h2>
  <p class="hint">
    Supabase emails them a one-time invite link. They choose their own password;
    the role below is applied automatically when they accept.
  </p>

  <input type="email" id="email" placeholder="Their email address" autocomplete="off">
  <select id="role">
    <option value="volunteer">Volunteer — app only</option>
    <option value="admin">Admin — app and leadership dashboard</option>
  </select>
  <button id="invite-btn">Send Invite</button>

  <div id="error"></div>
  <div id="msg"></div>

  <a class="back" href="../portal.html">← Back to members area</a>
</div>

<script src="../vendor/supabase-js-2.112.2.js"></script>
<script type="module" src="../js/invite.js"></script>

</body>
</html>
