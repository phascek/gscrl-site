<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSCRL — App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  #loading { color: #666; }
  #content { display: none; }
  #logout-btn { float: right; }
</style>
</head>
<body>

<div id="loading">Checking login…</div>

<div id="content">
  <button id="logout-btn">Log Out</button>
  <h2>App</h2>
  <p>Placeholder. Anything added here is visible only after login.</p>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(
    "https://jcqnsgbnsmwoncjehvqq.supabase.co",
    "sb_publishable_99kP3nKCaLhcwShKLs8zZA_K1nxz4xf"
  );

  const loadingEl = document.getElementById("loading");
  const contentEl = document.getElementById("content");

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = "../login.html";
      return;
    }

    loadingEl.style.display = "none";
    contentEl.style.display = "block";
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "../";
  });

  init();
</script>

</body>
</html>
