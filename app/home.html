<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSCRL — App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  #loading { color: #666; }
  #content { display: none; }
  #logout-btn { float: right; }
  .item { border: 1px solid #ddd; padding: 12px 16px; margin-top: 12px; }
  .item h3 { margin: 0 0 6px; font-size: 1em; }
  .item p { margin: 0; color: #444; }
  a.back { display: block; margin-top: 20px; font-size: 0.85em; }
</style>
</head>
<body>

<div id="loading">Checking login…</div>

<div id="content">
  <button id="logout-btn">Log Out</button>
  <h2>GSCRL App</h2>
  <div id="items"></div>
  <a class="back" href="../portal.html">← Back to members area</a>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const supabase = createClient(
    "https://jcqnsgbnsmwoncjehvqq.supabase.co",
    "sb_publishable_99kP3nKCaLhcwShKLs8zZA_K1nxz4xf"
  );

  const loadingEl = document.getElementById("loading");
  const contentEl = document.getElementById("content");
  const itemsEl = document.getElementById("items");

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = "../error.html";
      return;
    }

    // RLS returns app rows to any signed-in member, and nothing to anon.
    const { data, error } = await supabase
      .from("content")
      .select("id, title, body")
      .eq("area", "app")
      .order("id");

    if (error || !data || data.length === 0) {
      window.location.href = "../error.html";
      return;
    }

    loadingEl.style.display = "none";
    contentEl.style.display = "block";

    for (const row of data) {
      const div = document.createElement("div");
      div.className = "item";
      const h3 = document.createElement("h3");
      h3.textContent = row.title;
      const p = document.createElement("p");
      p.textContent = row.body;
      div.append(h3, p);
      itemsEl.append(div);
    }
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "../";
  });

  init();
</script>

</body>
</html>
