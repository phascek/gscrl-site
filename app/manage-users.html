<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GSCRL — Manage Users</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://jcqnsgbnsmwoncjehvqq.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<style>
  body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
  #loading { color: #666; }
  #content { display: none; }
  #logout-btn { float: right; width: auto; }
  h2 { margin-bottom: 4px; }
  section { border: 1px solid #ddd; padding: 16px; margin-top: 20px; }
  section h3 { margin: 0 0 12px; font-size: 1em; }
  label { display: block; font-size: 0.85em; color: #555; margin-top: 8px; }
  input, select { padding: 8px; box-sizing: border-box; }
  input[type=text], input[type=email] { width: 100%; }
  button { padding: 8px 14px; cursor: pointer; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; vertical-align: top; font-size: 0.9em; }
  th { font-size: 0.8em; text-transform: uppercase; color: #666; letter-spacing: 0.04em; }
  td.actions { white-space: nowrap; }
  td.actions select, td.actions input { margin-right: 6px; }
  .banned { color: #c0392b; }
  .muted { color: #888; font-size: 0.85em; }
  #error, .row-error { color: #c0392b; margin-top: 10px; font-size: 0.9em; }
  #msg { color: #2c7a2c; margin-top: 10px; font-size: 0.9em; }
  a.back { display: block; margin-top: 24px; font-size: 0.85em; }
  .overflow { overflow-x: auto; }
</style>
</head>
<body>

<div id="loading">Checking login…</div>

<div id="content">
  <button id="logout-btn">Log Out</button>
  <h2>Manage Users</h2>
  <p class="muted">Every role change is recorded with who made it, when, and why.</p>

  <section>
    <h3>Add a member</h3>
    <div class="row">
      <div>
        <label for="new-email">Email</label>
        <input type="email" id="new-email" placeholder="them@example.com" autocomplete="off">
      </div>
      <div>
        <label for="new-role">Role</label>
        <select id="new-role"></select>
      </div>
      <div>
        <label for="new-comment">Reason (optional)</label>
        <input type="text" id="new-comment" placeholder="Why they're being added">
      </div>
      <div style="flex:0 0 auto;">
        <button id="invite-btn">Send Invite</button>
      </div>
    </div>
    <div id="error"></div>
    <div id="msg"></div>
  </section>

  <section>
    <h3>Members</h3>
    <div class="row">
      <div>
        <label for="filter">Filter by email</label>
        <input type="text" id="filter" placeholder="Type to filter…">
      </div>
      <div>
        <label for="role-filter">Role</label>
        <select id="role-filter"><option value="">All roles</option></select>
      </div>
      <div>
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="email">Email (A–Z)</option>
          <option value="role">Role</option>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select>
      </div>
    </div>

    <div class="overflow">
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Role</th>
            <th>Added</th>
            <th>Change role</th>
          </tr>
        </thead>
        <tbody id="user-rows"></tbody>
      </table>
    </div>
    <p class="muted" id="count"></p>
  </section>

  <a class="back" href="home.html">← Back to the app</a>
</div>

<script src="../vendor/supabase-js-2.112.2.js"></script>
<script type="module" src="../js/manage-users.js"></script>

</body>
</html>
